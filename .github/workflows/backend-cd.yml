name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "api-main/**"
      - "fastapi_worker/**"
      - "deploy/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

concurrency:
  group: backend-cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      worker_image: ${{ steps.images.outputs.worker_image }}
      image_namespace: ${{ steps.images.outputs.image_namespace }}
      short_sha: ${{ steps.images.outputs.short_sha }}

    steps:
      - name: Resolve image names
        id: images
        run: |
          image_namespace="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"

          echo "image_namespace=${image_namespace}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${image_namespace}/blogtree-api" >> "$GITHUB_OUTPUT"
          echo "worker_image=ghcr.io/${image_namespace}/blogtree-worker" >> "$GITHUB_OUTPUT"

  verify-api-main:
    name: Verify api-main
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

  verify-fastapi-worker:
    name: Verify fastapi_worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fastapi_worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fastapi_worker/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall app

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs:
      - prepare
      - verify-api-main
      - verify-fastapi-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api-main
        uses: docker/build-push-action@v6
        with:
          context: api-main
          file: api-main/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.api_image }}:latest
            ${{ needs.prepare.outputs.api_image }}:sha-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=api-main
          cache-to: type=gha,mode=max,scope=api-main

      - name: Build and push fastapi_worker
        uses: docker/build-push-action@v6
        with:
          context: fastapi_worker
          file: fastapi_worker/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.worker_image }}:latest
            ${{ needs.prepare.outputs.worker_image }}:sha-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=fastapi-worker
          cache-to: type=gha,mode=max,scope=fastapi-worker

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - prepare
      - publish
    environment: production

    env:
      API_IMAGE: ${{ needs.prepare.outputs.api_image }}:sha-${{ needs.prepare.outputs.short_sha }}
      WORKER_IMAGE: ${{ needs.prepare.outputs.worker_image }}:sha-${{ needs.prepare.outputs.short_sha }}
      IMAGE_NAMESPACE: ${{ needs.prepare.outputs.image_namespace }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

    steps:
      - name: Validate deployment secrets
        run: |
          missing=()

          for name in PROD_SSH_HOST PROD_SSH_USER PROD_SSH_KEY PROD_DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deployment secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          if [ -z "${PROD_SSH_PORT}" ]; then
            echo "PROD_SSH_PORT=22" >> "$GITHUB_ENV"
          fi

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${PROD_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PROD_SSH_PORT}" "${PROD_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Log in to GHCR on production host
        run: |
          if [ -z "${GHCR_READ_TOKEN}" ]; then
            echo "GHCR_READ_TOKEN is not set; assuming production host can pull GHCR images."
            exit 0
          fi

          login_user="${GHCR_USERNAME:-${IMAGE_NAMESPACE}}"
          printf '%s' "${GHCR_READ_TOKEN}" | ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${PROD_SSH_PORT}" \
            "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            "docker login ghcr.io -u '${login_user}' --password-stdin"

      - name: Pull images and restart services
        run: |
          remote_env=$(printf 'PROD_DEPLOY_PATH=%q API_IMAGE=%q WORKER_IMAGE=%q' \
            "${PROD_DEPLOY_PATH}" \
            "${API_IMAGE}" \
            "${WORKER_IMAGE}")

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${PROD_SSH_PORT}" \
            "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            "${remote_env} bash -s" <<'EOF'
          set -euo pipefail

          cd "${PROD_DEPLOY_PATH}"
          git pull --ff-only

          docker compose -f deploy/docker-compose.yml pull api worker
          docker compose -f deploy/docker-compose.yml up -d api worker
          docker image prune -f
          EOF
