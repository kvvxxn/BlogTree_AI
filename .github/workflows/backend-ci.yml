name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "api-main/**"
      - "fastapi_worker/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-main:
    name: api-main
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build Docker image
        run: docker build -f Dockerfile -t blogtree-api:${{ github.sha }} .

  fastapi-worker:
    name: fastapi_worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fastapi_worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fastapi_worker/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall app

      - name: Build Docker image
        run: docker build -f Dockerfile -t blogtree-worker:${{ github.sha }} .
